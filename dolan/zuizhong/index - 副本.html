            <img id="clapEffect" src="resources/images/clap.png" style="position: absolute; bottom: 20px; left: 20px; display: none; width: 80px; height: 80px;" />
            <img id="flowerEffect" src="resources/images/flower.png" style="position: absolute; bottom: 20px; right: 20px; display: none; width: 80px; height: 80px;" />

<script src="resources/scripts/jquery-3.7.1.min.js"></script>
<script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
<script src="resources/scripts/axutils.js"></script>
<script src="resources/scripts/messagecenter.js"></script>
<script src="resources/scripts/player/axplayer.js"></script>
<script src="resources/scripts/player/init.js"></script>

<script type="text/javascript">
    // 全局变量
    let videoStream;
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let faceDetectionInterval; // 表情检测定时器

    // 加载表情识别模型
    async function loadFaceModels() {
        try {
            // 模型路径（可替换为本地路径）
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), // 轻量级人脸检测模型
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), // 人脸关键点模型
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL), // 人脸识别模型
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL) // 表情识别模型
            ]);
            console.log('表情识别模型加载完成');
        } catch (err) {
            console.error('模型加载失败：', err);
        }
    }

    // 初始化视频流
    async function initVideo() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480 },
                audio: true // 同时捕获音频
            });
            const video = document.getElementById('video');
            video.srcObject = videoStream;
            return video;
        } catch (err) {
            console.error('获取摄像头失败：', err);
            alert('请允许摄像头权限以使用功能');
        }
    }

    // 检测表情并触发特效
    async function detectFacialExpression(video) {
        const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceExpressions();

        if (detections) {
            const expressions = detections.expressions;
            // 获取最可能的表情及置信度（笑脸的置信度阈值设为0.7）
            const happyConfidence = expressions.happy;
            if (happyConfidence > 0.7) {
                console.log('检测到笑脸！置信度：', happyConfidence);
                showEffects(); // 触发特效
            }
        }
    }

    // 显示特效（点赞、鼓掌、玫瑰花）
    function showEffects() {
        const like = document.getElementById('likeEffect');
        const clap = document.getElementById('clapEffect');
        const flower = document.getElementById('flowerEffect');
        const audio = document.getElementById('celebrationAudio');

        // 显示特效
        like.style.display = 'block';
        clap.style.display = 'block';
        flower.style.display = 'block';
        audio.play(); // 播放庆祝音效

        // 3秒后隐藏特效
        setTimeout(() => {
            like.style.display = 'none';
            clap.style.display = 'none';
            flower.style.display = 'none';
        }, 3000);
    }

    // 开始/停止录制
    function toggleRecording() {
        const recordBtn = document.getElementById('recordBtn');
        if (isRecording) {
            // 停止录制
            mediaRecorder.stop();
            recordBtn.textContent = '开始录制';
            isRecording = false;
            console.log('录制停止');
        } else {
            // 开始录制
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                // 生成录制文件并提供下载
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dance_effects.webm';
                a.click();
                URL.revokeObjectURL(url);
            };
            mediaRecorder.start();
            recordBtn.textContent = '停止录制';
            isRecording = true;
            console.log('录制开始');
        }
    }

    // 绑定按钮事件
    document.addEventListener('DOMContentLoaded', async () => {
        // 预加载表情模型
        await loadFaceModels();

        // 开始检测按钮
        document.getElementById('startBtn').addEventListener('click', async () => {
            const video = await initVideo();
            if (video) {
                // 每500ms检测一次表情（平衡性能与实时性）
                faceDetectionInterval = setInterval(() => detectFacialExpression(video), 500);
                document.getElementById('startBtn').disabled = true;
                document.getElementById('startBtn').textContent = '检测中...';
            }
        });

        // 录制按钮
        document.getElementById('recordBtn').addEventListener('click', toggleRecording);
    });

    // 页面关闭时清理资源
    window.addEventListener('beforeunload', () => {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        if (faceDetectionInterval) {
            clearInterval(faceDetectionInterval);
        }
    });
</script>
