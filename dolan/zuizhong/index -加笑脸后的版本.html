<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <title>特效展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            background-image: url('bodyback.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        #dance-video {
            left: 0%;
            top: 16%;
            width: 20vw;
            height: 70vh;
            object-fit: cover;
        }

        #container {
            position: relative;
            top: 16%;
            width: 66.67vw;
            height: 66.67vh;
            margin: 0 auto;
            transform: scale(1.2);
            transform-origin: center;
        }

        video,
        canvas {
            position: absolute;
            top: 6%;
            left: 15%;
            width: 960px;
            height: 540px;
            transform: scaleX(-1);
            object-fit: cover;
        }

        #dance-video {
            transform: scaleX(1);
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        #likeEffect {
            position: absolute;
            left: 20%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
            animation: fadeInOut 2s ease-in-out;
            width: 300px;
            height: 300px;
        }

        #straightEffect {
            position: absolute;
            left: 80%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
            animation: fadeInOut 2s ease-in-out;
            width: 300px;
            height: 300px;
        }

        #heartEffectContainer {
            position: absolute;
            pointer-events: none;
            z-index: 100;
            left: 160px;
            width: 90%;
            height: 200px;
            background-image: url('heart.gif');
            background-repeat: repeat-x;
            background-size: auto 100%;
            z-index: 100;
            display: none;
        }

        #handEffectContainer {
            position: absolute;
            pointer-events: none;
            left: 160px;
            bottom: 5px;
            width: 90%;
            height: 200px;
            background-image: url('hand.gif');
            background-repeat: repeat-x;
            background-size: auto 100%;
            z-index: 100;
            display: none;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            font-size: 14px;
        }
    </style>
    <!-- 引入 TensorFlow.js 和 MoveNet 模型 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <!-- 引入 Face-API.js 用于笑容识别 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.19.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>

<body>
    <div id="status">系统准备中...</div>
    
    <div id="main-container">
        <video id="dance-video" autoplay muted loop>
            <source src="dance.mp4" type="video/mp4">
        </video>
        <div id="container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
            <img id="likeEffect" src="zhuan.png" />
            <div id="heartEffectContainer"></div>
            <div id="handEffectContainer"></div>
            <img id="straightEffect" src="straight.png" />
        </div>
    </div>

    <div id="controls">
        <button id="startCam">开启摄像头</button>
        <button id="toggleMusic">播放/暂停音乐</button>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" src="music.mp3" loop></audio>
    <audio id="like-sound" src="like-sound.mp3" preload="auto"></audio>

    <!-- 特效贴图（必须透明 PNG） -->
    <img id="hat" src="hat.png" style="display: none" />
    <img id="clothes" src="clothes.png" style="display: none" />
    <img id="like" src="like.png" style="display: none" />
    <img id="straight" src="straight.png" style="display: none" />

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const startCamBtn = document.getElementById("startCam");
        const toggleMusicBtn = document.getElementById("toggleMusic");
        const bgm = document.getElementById("bgm");
        const hat = document.getElementById("hat");
        const clothes = document.getElementById("clothes");
        const like = document.getElementById("like");
        const straight = document.getElementById("straight");
        const likeEffect = document.getElementById("likeEffect");
        const straightEffect = document.getElementById("straightEffect");
        const heartEffect = document.getElementById("heartEffectContainer");
        const handEffect = document.getElementById("handEffectContainer");
        const statusDiv = document.getElementById("status");
        const danceVideo = document.getElementById("dance-video");
        const likeSound = document.getElementById("like-sound");

        let stream;
        let drawInterval;
        let detector;
        let faceDetectionInterval;
      
        let armsTimeout;
        let lastSmileTime = 0;
        let lastArmsTime = 0;
        let lastSmileTriggerTime = 0;
		let isArmsStraight = false;
		let isTurning = false;
		let lastTurnTime = 0;
		let previousAngle = null;
        let lastAngle = null;
        let angleHistory = [];

        // 更新状态显示
        function updateStatus(message) {
            statusDiv.textContent = message;
            console.log(message);
        }

        // 加载面部识别模型
        async function loadFaceModels() {
            try {
                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                updateStatus('面部识别模型加载完成');
            } catch (err) {
                console.error('面部模型加载失败：', err);
                updateStatus('面部识别模型加载失败，将仅使用姿态识别');
            }
        }

        // 检测面部表情（特别是笑容）
        async function detectFacialExpression() {
            try {
                const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceExpressions();

                if (detections) {
                    const expressions = detections.expressions;
                    const happyConfidence = expressions.happy;
                    
                    // 检测到笑容且置信度大于0.7
                    if (happyConfidence > 0.7) {
                        const now = Date.now();
                        // 防止频繁触发，设置3秒冷却时间
                        if (now - lastSmileTriggerTime > 3000) {
                            console.log('检测到笑容！置信度：', happyConfidence);
                            triggerAllEffects();
                            lastSmileTriggerTime = now;
                        }
                    }
                }
            } catch (error) {
                console.error('面部识别错误:', error);
            }
        }

        // 触发所有特效的统一函数
        function triggerAllEffects() {
            console.log('触发所有特效');
            
            // 显示所有视觉特效
            likeEffect.style.display = 'block';
            straightEffect.style.display = 'block';
            heartEffect.style.display = 'block';
            handEffect.style.display = 'block';

            // 播放音效
            likeSound.play();

            // 3秒后隐藏所有特效
            setTimeout(() => {
                likeEffect.style.display = 'none';
                straightEffect.style.display = 'none';
                heartEffect.style.display = 'none';
                handEffect.style.display = 'none';
            }, 3000);
        }

        // 获取肩膀连线角度的函数
        function getShoulderAngle(leftShoulder, rightShoulder) {
            const dx = rightShoulder.x - leftShoulder.x;
            const dy = rightShoulder.y - leftShoulder.y;
            return Math.atan2(dy, dx) * 180 / Math.PI;
        }

        // 更新角度历史
        function updateAngleHistory(angle) {
            if (angleHistory.length > 10) angleHistory.shift();
            angleHistory.push(angle);
        }

        // 判断是否正在转圈
        function isTurningAround() {
            if (angleHistory.length < 10) return false;

            let totalChange = 0;
            for (let i = 1; i < angleHistory.length; i++) {
                let delta = angleHistory[i] - angleHistory[i - 1];
                if (delta > 180) delta -= 360;
                if (delta < -180) delta += 360;
                totalChange += delta;
            }

            return Math.abs(totalChange) > 180;
        }

        // 初始化姿态检测模型
        async function initPoseModel() {
            try {
                const model = poseDetection.SupportedModels.MoveNet;
                detector = await poseDetection.createDetector(model, {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                });
                updateStatus('姿态检测模型初始化成功');
            } catch (error) {
                console.error('初始化姿态检测模型失败:', error);
                updateStatus('姿态检测模型初始化失败');
            }
        }

        // 计算两点之间的距离
        function calculateDistance(point1, point2) {
            return Math.sqrt(
                Math.pow(point1.x - point2.x, 2) +
                Math.pow(point1.y - point2.y, 2)
            );
        }

        // 计算角度
        function calculateAngle(point1, point2, point3) {
            const v1 = {
                x: point1.x - point2.x,
                y: point1.y - point2.y
            };
            const v2 = {
                x: point3.x - point2.x,
                y: point3.y - point2.y
            };
            const dotProduct = v1.x * v2.x + v1.y * v2.y;
            const magnitude1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            const magnitude2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
            return Math.acos(dotProduct / (magnitude1 * magnitude2)) * (180 / Math.PI);
        }

        // 开启摄像头
        startCamBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: 640,
                        height: 480
                    },
                    audio: false
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    // 开始面部表情检测（每500ms检测一次）
                    faceDetectionInterval = setInterval(detectFacialExpression, 500);

                    // 姿态检测和绘制循环
                    drawInterval = setInterval(async () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        if (detector) {
                            const poses = await detector.estimatePoses(video);
                            if (poses.length > 0) {
                                const keypoints = poses[0].keypoints;

                                const nose = keypoints.find(p => p.name === "nose");
                                const leftShoulder = keypoints.find(p => p.name === "left_shoulder");
                                const rightShoulder = keypoints.find(p => p.name === "right_shoulder");
                                const leftElbow = keypoints.find(p => p.name === "left_elbow");
                                const rightElbow = keypoints.find(p => p.name === "right_elbow");
                                const leftWrist = keypoints.find(p => p.name === "left_wrist");
                                const rightWrist = keypoints.find(p => p.name === "right_wrist");

                                // 检测手臂伸直
                                if (leftShoulder && rightShoulder && leftElbow && rightElbow &&
                                    leftWrist && rightWrist) {
                                    const leftArmAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
                                    const rightArmAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);

                                    const newIsArmsStraight =
                                        Math.abs(leftArmAngle - 180) < 20 &&
                                        Math.abs(rightArmAngle - 180) < 20 &&
                                        leftShoulder.score > 0.5 &&
                                        rightShoulder.score > 0.5 &&
                                        leftElbow.score > 0.5 &&
                                        rightElbow.score > 0.5 &&
                                        leftWrist.score > 0.5 &&
                                        rightWrist.score > 0.5;

                                    if (newIsArmsStraight !== isArmsStraight) {
                                        isArmsStraight = newIsArmsStraight;
                                        if (isArmsStraight) {
                                            const now = Date.now();
                                            if (now - lastArmsTime > 3000) {
                                                console.log('检测到手臂伸直，触发所有特效');
                                                triggerAllEffects();
                                                clearTimeout(armsTimeout);
                                                armsTimeout = setTimeout(() => {
                                                    // 特效已经在triggerAllEffects中设置了自动隐藏
                                                }, 2000);
                                                lastArmsTime = now;
                                            }
                                        }
                                    }
                                }

                                // 检测转圈动作
                                if (leftShoulder && rightShoulder) {
                                    const angle = getShoulderAngle(leftShoulder, rightShoulder);
                                    updateAngleHistory(angle);

                                    if (isTurningAround()) {
                                        console.log('检测到转圈动作，触发所有特效');
                                        triggerAllEffects();
                                    }
                                }

                                // 帽子定位在头上
                                if (nose && nose.score > 0.5) {
                                    const hatWidth = 150;
                                    const hatHeight = 120;
                                    ctx.drawImage(hat, nose.x - hatWidth / 2, nose.y - hatHeight - 20, hatWidth, hatHeight);
                                }

                                // 衣服定位在脖子下方
                                if (leftShoulder && rightShoulder && leftShoulder.score > 0.5 && rightShoulder.score > 0.5) {
                                    const centerX = (leftShoulder.x + rightShoulder.x) / 2;
                                    const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
                                    const clothesWidth = shoulderWidth * 2;
                                    const clothesHeight = clothesWidth * 1.5;
                                    const neckOffset = 30;
                                    ctx.drawImage(clothes, centerX - clothesWidth / 2, leftShoulder.y - neckOffset, clothesWidth, clothesHeight);
                                }
                            }
                        }
                    }, 100);
                };

                startCamBtn.disabled = true;
                updateStatus('摄像头已开启，开始检测动作和表情');
            } catch (error) {
                console.error('获取摄像头权限失败:', error);
                updateStatus('无法获取摄像头权限，请检查设置');
                alert('无法获取摄像头权限，请检查设置。');
            }
        };

        // 控制音乐播放
        toggleMusicBtn.onclick = () => {
            if (bgm.paused) {
                bgm.play();
                toggleMusicBtn.textContent = '暂停音乐';
            } else {
                bgm.pause();
                toggleMusicBtn.textContent = '播放音乐';
            }
        };

        // 初始化所有模型
        async function initAllModels() {
            updateStatus('正在加载模型...');
            await Promise.all([
                initPoseModel(),
                loadFaceModels()
            ]);
            updateStatus('所有模型加载完成，点击"开启摄像头"开始');
        }

        // 页面加载时初始化
        window.addEventListener('load', initAllModels);

        // 页面关闭时清理资源
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (drawInterval) {
                clearInterval(drawInterval);
            }
            if (faceDetectionInterval) {
                clearInterval(faceDetectionInterval);
            }
        });
    </script>
</body>
</html>
